<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BEBFF"/>
      <stop offset=".55" stop-color="#36B3EE"/>
      <stop offset="1" stop-color="#0A78C6"/>
    </linearGradient>
    <radialGradient id="sun" cx=".28" cy=".22" r=".55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#FFFFFF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B6F29A"/>
      <stop offset=".45" stop-color="#5CCB6A"/>
      <stop offset="1" stop-color="#1E9150"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE3A5"/>
      <stop offset="1" stop-color="#2E9E68"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F7FF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#04466F" flood-opacity=".35"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#sun)"/>
    <!-- bubbles -->
    <circle cx="410" cy="120" r="22" fill="#fff" fill-opacity=".22"/>
    <circle cx="404" cy="113" r="7" fill="#fff" fill-opacity=".6"/>
    <circle cx="452" cy="196" r="11" fill="#fff" fill-opacity=".2"/>
    <circle cx="96" cy="250" r="14" fill="#fff" fill-opacity=".18"/>
    <!-- hills -->
    <path d="M-20 420 C 90 360, 210 370, 300 405 S 470 430, 540 380 L 540 540 L -20 540 Z" fill="url(#hill2)"/>
    <path d="M-20 450 C 110 395, 260 400, 360 440 S 500 470, 540 450 L 540 540 L -20 540 Z" fill="url(#hill)"/>
    <path d="M40 432 C 130 404, 230 406, 320 432" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/>
    <!-- runner -->
    <g filter="url(#sh)" stroke="url(#fig)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M262 196 L232 290"/>
      <path d="M254 214 L304 250 L346 226"/>
      <path d="M254 214 L208 240 L176 214"/>
      <path d="M232 290 L292 322 L286 392"/>
      <path d="M232 290 L196 346 L138 352"/>
      <circle cx="288" cy="146" r="33" fill="url(#fig)" stroke="none"/>
    </g>
    <!-- motion arcs -->
    <path d="M118 168 C 132 150, 150 140, 172 136" stroke="#fff" stroke-opacity=".75" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M96 214 C 108 200, 122 192, 140 188" stroke="#fff" stroke-opacity=".5" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- gloss -->
    <path d="M0 0 H512 V170 C 380 230, 160 230, 0 190 Z" fill="url(#gloss)" opacity=".55"/>
  </g>
</svg>
